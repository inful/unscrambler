# Draw — air -c .air.draw.toml
# http://localhost:8082
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
args_bin = []
bin = "./tmp/draw"
cmd = "go build -o ./tmp/draw ./cmd/draw"
full_bin = "PORT=8082 ./tmp/draw"
delay = 1000
exclude_dir = ["assets", "tmp", "vendor", "testdata", "node_modules"]
exclude_file = []
exclude_regex = ["_test.go", "_templ.go"]
exclude_unchanged = false
follow_symlink = false
include_dir = []
include_ext = ["go", "tpl", "tmpl", "templ", "html", "js", "css"]
include_file = []
kill_delay = "500ms"
log = "tmp/build-errors-draw.log"
poll = false
poll_interval = 0
post_cmd = []
pre_cmd = ["templ generate ./views/..."]
rerun = false
rerun_delay = 500
send_interrupt = true
stop_on_error = false

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
main_only = false
silent = false
time = false

[misc]
clean_on_exit = false

[proxy]
app_port = 0
enabled = false
proxy_port = 0

[screen]
clear_on_rebuild = false
keep_scroll = true
